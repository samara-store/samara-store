<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر | SAMARA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Amiri:wght@700&family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================
   ATHAR / أثر — luxury editorial theme
   ============================================ */
:root {
  --bg: #FBF9F5;
  --card: #FFFFFF;
  --sand: #F2ECE4;
  --ink: #2A2827;
  --ink-soft: #6b6156;
  --line: #E5DEC3;
  --accent: #8C6239;
  --accent-soft: #A67C52;
  --white: #FFFFFF;

  --font-display: 'Playfair Display', 'Amiri', serif;
  --font-nav: 'Montserrat', 'Tajawal', sans-serif;
  --font-body: 'Inter', 'Tajawal', sans-serif;
  --radius: 2px;
  --gap: 24px;
  --maxw: 1280px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select { font-family: var(--font-body); font-size: 1rem; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============================================
   Header
   ============================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
  gap: 16px;
}

.logo-block {
  display: flex;
  flex-direction: column;
  gap: 3px;
  line-height: 1;
}
.logo {
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: #000000;
}
.logo-slogan {
  font-family: var(--font-nav);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
}

.main-nav {
  display: flex;
  gap: 30px;
  font-family: var(--font-nav);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.main-nav a { padding-bottom: 4px; border-bottom: 1px solid transparent; }
.main-nav a:hover, .main-nav a.active { border-color: var(--accent); color: var(--accent); }

.header-actions { display: flex; align-items: center; gap: 16px; }

.lang-btn {
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.78rem;
  font-family: var(--font-nav);
  letter-spacing: 0.1em;
}
.lang-btn:hover { background: var(--ink); color: var(--white); }

.cart-btn {
  position: relative;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: 9px 18px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.78rem;
  font-family: var(--font-nav);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.cart-btn:hover { background: var(--ink); color: var(--white); }
.cart-count {
  position: absolute;
  top: -8px;
  inset-inline-end: -8px;
  background: var(--accent);
  color: var(--white);
  font-size: 0.68rem;
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.nav-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--ink);
}

@media (max-width: 780px) {
  .main-nav { display: none; }
  .nav-toggle { display: block; }
  .main-nav.open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    inset-inline: 0;
    background: var(--bg);
    padding: 16px 32px 24px;
    border-bottom: 1px solid var(--line);
    gap: 18px;
  }
}

/* ============================================
   Hero — widescreen editorial banner with
   a centered floating headline box
   ============================================ */
.hero {
  position: relative;
}
.hero-media {
  width: 100%;
  aspect-ratio: 16/8;
  overflow: hidden;
  background: var(--sand);
}
.hero-media img { width: 100%; height: 100%; object-fit: cover; }

.hero-floating {
  position: relative;
  margin: -70px auto 0;
  max-width: 780px;
  background: rgba(255,255,255,0.96);
  padding: 44px 48px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(42,40,39,.12);
}

.hero-kicker {
  color: var(--accent);
  font-family: var(--font-nav);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3.4vw, 2.4rem);
  font-weight: 700;
  line-height: 1.3;
  margin: 0 0 16px;
}
.hero-desc {
  font-size: 1rem;
  color: var(--ink-soft);
  margin: 0 0 26px;
}

@media (max-width: 780px) {
  .hero-media { aspect-ratio: 3/4; }
  .hero-floating { margin-top: -50px; padding: 32px 24px; width: calc(100% - 32px); }
}

/* ============================================
   Buttons
   ============================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 30px;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-family: var(--font-nav);
  cursor: pointer;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--white);
  width: fit-content;
  transition: background .2s ease, color .2s ease;
}
.btn:hover { background: transparent; color: var(--ink); }

.btn-outline { background: transparent; color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--white); }

.btn-block { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--ink); color: var(--white); }

/* ============================================
   Section headings
   ============================================ */
.section { padding: 76px 0; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 40px;
  gap: 16px;
  flex-wrap: wrap;
}
.section-title {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  margin: 0;
}
.section-link {
  font-family: var(--font-nav);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--ink);
}

/* ============================================
   Category grid — 3 columns
   ============================================ */
.cat-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
}
.cat-card {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: var(--sand);
  display: block;
}
.cat-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.cat-card:hover img { transform: scale(1.04); }
.cat-label-wrap {
  position: absolute;
  bottom: 0; inset-inline: 0;
  padding: 24px 20px;
  background: linear-gradient(transparent, rgba(0,0,0,.55));
  color: var(--white);
}
.cat-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  margin-bottom: 4px;
}
.cat-desc { font-size: 0.8rem; opacity: 0.9; }

@media (max-width: 860px) { .cat-strip { grid-template-columns: 1fr; } }

/* ============================================
   Product grid & cards
   ============================================ */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px 24px;
}
@media (max-width: 980px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: 28px 16px; } }

.product-card { display: block; }
.product-media {
  position: relative;
  aspect-ratio: 4/5;
  overflow: hidden;
  background: var(--sand);
  margin-bottom: 16px;
}
.product-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.product-card:hover .product-media img { transform: scale(1.035); }

.product-tag {
  position: absolute;
  top: 12px;
  inset-inline-start: 12px;
  background: var(--card);
  color: var(--accent);
  font-family: var(--font-nav);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: var(--radius);
}
.stock-badge {
  position: absolute;
  top: 12px;
  inset-inline-end: 12px;
  font-family: var(--font-nav);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 5px 10px;
  border-radius: var(--radius);
  color: var(--white);
  z-index: 2;
}
.stock-badge.low { background: #C1743A; }
.stock-badge.out { background: #8a3a3a; }
.product-card.out-of-stock .product-media { opacity: 0.55; }
.product-card.out-of-stock .product-name,
.product-card.out-of-stock .product-price { opacity: 0.55; }
.product-cat {
  font-family: var(--font-nav);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-soft);
  margin-bottom: 6px;
}
.product-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0 0 6px; }
.product-price { color: var(--ink-soft); font-size: 0.92rem; }
.price-compare { text-decoration: line-through; opacity: 0.6; margin-inline-end: 8px; }
.price-now { color: var(--accent); font-weight: 700; }
.gift-badge {
  margin-top: 8px;
  display: inline-block;
  font-family: var(--font-nav);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--line);
  padding: 4px 9px;
  border-radius: var(--radius);
}

/* Filters */
.filter-row { display: flex; gap: 10px; margin-bottom: 36px; flex-wrap: wrap; }
.filter-chip {
  padding: 9px 18px;
  border: 1px solid var(--ink);
  border-radius: 20px;
  font-family: var(--font-nav);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
}
.filter-chip.active { background: var(--ink); color: var(--white); }

/* ============================================
   Product detail
   ============================================ */
.product-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  padding: 60px 0 84px;
}
@media (max-width: 860px) { .product-detail { grid-template-columns: 1fr; gap: 28px; } }

.pd-media { background: var(--sand); aspect-ratio: 4/5; overflow: hidden; }
.pd-media img { width: 100%; height: 100%; object-fit: cover; }

.pd-info .breadcrumb {
  font-family: var(--font-nav);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 20px;
}
.pd-info h1 { font-family: var(--font-display); font-size: 2rem; margin: 0 0 12px; font-weight: 700; }
.pd-price { font-size: 1.25rem; font-weight: 700; margin-bottom: 24px; color: var(--accent); }
.pd-desc { color: var(--ink-soft); margin-bottom: 30px; max-width: 48ch; }

.option-group { margin-bottom: 26px; }
.option-label {
  font-family: var(--font-nav);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: block;
  color: var(--ink-soft);
}

.swatches { display: flex; gap: 10px; }
.swatch {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  position: relative;
}
.swatch.selected { border-color: var(--ink); }
.swatch.selected::after {
  content: '';
  position: absolute; inset: -6px;
  border: 1px solid var(--ink);
  border-radius: 50%;
}

.size-options { display: flex; gap: 8px; flex-wrap: wrap; }
.size-btn {
  padding: 10px 16px;
  border: 1px solid var(--line);
  background: var(--card);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  border-radius: var(--radius);
}
.size-btn.selected { border-color: var(--ink); background: var(--ink); color: var(--white); }

.qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.qty-control { display: flex; align-items: center; border: 1px solid var(--line); }
.qty-control button { background: none; border: none; width: 38px; height: 38px; cursor: pointer; font-size: 1.1rem; }
.qty-control span { width: 34px; text-align: center; font-weight: 700; }

.pd-actions { display: flex; gap: 12px; flex-wrap: wrap; }

.pd-meta { margin-top: 30px; font-size: 0.85rem; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 20px; }
.pd-meta p { margin: 4px 0; }

/* ============================================
   Cart & Checkout
   ============================================ */
.cart-layout, .checkout-layout {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 52px;
  padding: 60px 0 84px;
  align-items: start;
}
.checkout-layout { grid-template-columns: 1.3fr 1fr; }
@media (max-width: 860px) { .cart-layout, .checkout-layout { grid-template-columns: 1fr; } }

.cart-item {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  gap: 18px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.cart-item img { aspect-ratio: 4/5; object-fit: cover; }
.cart-item-name { font-family: var(--font-display); font-weight: 600; margin: 0 0 4px; }
.cart-item-meta { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 10px; }
.cart-item-remove { font-size: 0.8rem; color: var(--accent); cursor: pointer; border: none; background: none; padding: 0; font-weight: 600; }
.cart-item-price { font-weight: 700; text-align: end; white-space: nowrap; }

.summary-box { background: var(--sand); padding: 32px; border: 1px solid var(--line); }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
.summary-row.total { font-weight: 800; font-size: 1.15rem; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }

.empty-state { text-align: center; padding: 100px 24px; color: var(--ink-soft); }
.empty-state h2 { font-family: var(--font-display); color: var(--ink); margin-bottom: 10px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
input[type="text"], input[type="email"], input[type="tel"], select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--radius);
  color: var(--ink);
}
textarea { resize: vertical; min-height: 80px; }

.pay-note {
  background: var(--sand);
  border: 1px dashed var(--accent-soft);
  padding: 16px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-top: 8px;
  border-radius: var(--radius);
}

.order-success { text-align: center; padding: 100px 24px; }
.order-success h2 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 12px; }
.order-success .num { color: var(--accent); font-weight: 800; }

/* ============================================
   Footer
   ============================================ */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 56px 0 36px;
  margin-top: 40px;
}
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; margin-bottom: 36px; }
@media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-grid h4 {
  font-family: var(--font-nav);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 16px;
}
.footer-logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: #000000; letter-spacing: 0.06em; margin-bottom: 6px; }
.footer-slogan { font-family: var(--font-nav); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
.footer-grid ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; color: var(--ink-soft); }
.footer-bottom { font-size: 0.8rem; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 22px; letter-spacing: 0.03em; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--white);
  padding: 13px 22px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.85rem;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
[dir="rtl"] .toast { transform: translateX(50%); }
.toast.show { opacity: 1; }

/* ============================================
   Policy modal
   ============================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(42,40,39,.55);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--card);
  max-width: 480px;
  width: 100%;
  padding: 36px 32px;
  position: relative;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 16px;
  inset-inline-end: 16px;
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: var(--ink-soft);
  line-height: 1;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  margin: 0 0 16px;
}
.modal-body { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.7; margin-bottom: 24px; }
.footer-link-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--ink-soft);
  text-align: inherit;
}
.footer-link-btn:hover { color: var(--accent); }

/* ============================================
   Contact / WhatsApp
   ============================================ */
.contact-block {
  background: var(--sand);
  border: 1px solid var(--line);
  padding: 24px 28px;
  margin-top: 20px;
  text-align: center;
}
.contact-title {
  font-family: var(--font-nav);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 14px;
}
.contact-whatsapp-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #25D366;
  color: var(--white);
  border: none;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-family: var(--font-nav);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}
.contact-number {
  margin-top: 12px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  direction: ltr;
  display: inline-block;
}

.whatsapp-float {
  position: fixed;
  bottom: 20px;
  inset-inline-end: 20px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #25D366;
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(37,211,102,.4);
  z-index: 90;
  font-size: 1.5rem;
}

</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="index.html" class="logo-block">
      <span class="logo">SAMARA</span>
      <span class="logo-slogan">Elegance in Every Detail</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-i18n="nav_home">الرئيسية</a>
      <a href="shop.html" class="active" data-i18n="nav_shop">التشكيلات</a>
      <a href="shop.html?cat=jewelry" data-i18n="nav_jewelry">مجوهرات</a>

function getLang() {
  return localStorage.getItem("athar_lang") || "ar";
}

function setLang(lang) {
  localStorage.setItem("athar_lang", lang);
  applyLang();
  wireContactButtons();
}

function t(key) {
  const lang = getLang();
  return (I18N[lang] && I18N[lang][key]) || key;
}

function pName(p) { return p.name[getLang()]; }
function pDesc(p) { return p.desc[getLang()]; }

function applyLang(triggerOnLangChange = true) {
  const lang = getLang();
  const dict = I18N[lang];
  document.documentElement.lang = lang === "ar" ? "ar" : "en";
  document.documentElement.dir = dict.dir;

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (dict[key]) el.setAttribute("placeholder", dict[key]);
  });

  const langBtn = document.getElementById("langBtn");
  if (langBtn) langBtn.textContent = dict.lang_switch;

  // Re-render any dynamic page content that depends on language
  if (triggerOnLangChange && typeof onLangChange === "function") onLangChange();
}

/* ---------- money ---------- */
function money(n) {
  const lang = getLang();
  const formatted = n.toLocaleString(lang === "ar" ? "ar-EG" : "en-US");
  return lang === "ar" ? `${formatted} ج.م` : `EGP ${formatted}`;
}

/* ---------- cart (localStorage) ----------
   cart item shape: { id, size, color, qty }
------------------------------------------- */
function getCart() {
  try {
    return JSON.parse(localStorage.getItem("athar_cart")) || [];
  } catch (e) {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem("athar_cart", JSON.stringify(cart));
  updateCartCount();
}

function findProduct(id) {
  return PRODUCTS.find((p) => p.id === id);
}

function addToCart(id, size, color, qty) {
  const cart = getCart();
  const existing = cart.find((i) => i.id === id && i.size === size && i.color === color);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({ id, size, color, qty });
  }
  saveCart(cart);
  showToast(t("added_to_cart"));
}

function removeFromCart(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);
}

function updateCartQty(index, qty) {
  const cart = getCart();
  if (!cart[index]) return;
  cart[index].qty = Math.max(1, qty);
  saveCart(cart);
}

function cartCount() {
  return getCart().reduce((sum, i) => sum + i.qty, 0);
}

function cartSubtotal() {
  return getCart().reduce((sum, i) => {
    const p = findProduct(i.id);
    return p ? sum + p.price * i.qty : sum;
  }, 0);
}

function cartTotal() {
  return cartSubtotal() + SHIPPING_FEE;
}

function updateCartCount() {
  const el = document.getElementById("cartCount");
  if (el) el.textContent = cartCount();
}

/* ---------- toast ---------- */
function showToast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

  if (typeof p.stock !== "number") return "";

  if (p.stock <= LOW_STOCK_THRESHOLD) return `<span class="stock-badge low">${t("low_stock").replace("{n}", p.stock)}</span>`;
  return "";
}

  const giftBadge = p.gifting ? `<div class="gift-badge">${t("gifting_badge")}</div>` : "";
  const outClass = p.stock === 0 ? " out-of-stock" : "";
  return `
    <a class="product-card${outClass}" href="product.html?id=${p.id}">
      <div class="product-media">
        ${tagHTML}
        ${stockBadgeHTML(p)}
        <img src="${p.image}" alt="${pName(p)}" loading="lazy">
      </div>
      <div class="product-cat">${catLabel}</div>
      <h3 class="product-name">${pName(p)}</h3>
      <div class="product-price">${priceHTML}</div>
      ${giftBadge}
    </a>
  `;
}

/* ---------- header wiring (nav toggle, lang, cart count) ---------- */
function wireHeader() {
  const langBtn = document.getElementById("langBtn");
  if (langBtn) {
    langBtn.addEventListener("click", () => setLang(getLang() === "ar" ? "en" : "ar"));
  }
  const navToggle = document.getElementById("navToggle");
  const mainNav = document.getElementById("mainNav");
  if (navToggle && mainNav) {
    navToggle.addEventListener("click", () => mainNav.classList.toggle("open"));
  }
  updateCartCount();
}

/* ---------- policy modal ---------- */
function fillPolicyModal() {
  const titleEl = document.getElementById("policyModalTitle");
  const bodyEl = document.getElementById("policyModalBody");
  if (titleEl) titleEl.textContent = t("policy_modal_title");
  if (bodyEl) bodyEl.textContent = t("policy_modal_body").replace("{days}", RETURN_POLICY_DAYS);
}

function openPolicyModal() {
  fillPolicyModal();
  const overlay = document.getElementById("policyModal");
  if (overlay) overlay.classList.add("open");
}

function closePolicyModal() {
  const overlay = document.getElementById("policyModal");
  if (overlay) overlay.classList.remove("open");
}

function wirePolicyModal() {
  const trigger = document.getElementById("policyModalTrigger");
  const closeBtn = document.getElementById("policyModalClose");
  const overlay = document.getElementById("policyModal");
  if (trigger) trigger.addEventListener("click", openPolicyModal);
  if (closeBtn) closeBtn.addEventListener("click", closePolicyModal);
  if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) closePolicyModal(); });
  fillPolicyModal();
}

/* ---------- general contact WhatsApp (not order-specific) ---------- */
function contactWhatsAppUrl() {
  const msg = getLang() === "ar" ? "أهلاً، عندي استفسار عن سمارة" : "Hi, I have a question about SAMARA";
  return `https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(msg)}`;
}

function wireContactButtons() {
  document.querySelectorAll(".js-contact-whatsapp").forEach((el) => {
    el.setAttribute("href", contactWhatsAppUrl());
    el.setAttribute("target", "_blank");
    el.setAttribute("rel", "noopener");
  });
}

document.addEventListener("DOMContentLoaded", () => {
  wireHeader();
  wirePolicyModal();
  wireContactButtons();
  applyLang();
});

</script>
<script>
  let currentFilter = new URLSearchParams(location.search).get("cat") || "all";

  function renderShopGrid() {
    const grid = document.getElementById("shopGrid");
    const list = currentFilter === "all" ? PRODUCTS : PRODUCTS.filter((p) => p.category === currentFilter);
    grid.innerHTML = list.map(productCardHTML).join("");
  }

  function setActiveChip() {
    document.querySelectorAll(".filter-chip").forEach((chip) => {
      chip.classList.toggle("active", chip.dataset.filter === currentFilter);
    });
  }

  document.querySelectorAll(".filter-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      currentFilter = chip.dataset.filter;
      setActiveChip();
      renderShopGrid();
    });
  });

  function onLangChange() { renderShopGrid(); }
  setActiveChip();
  renderShopGrid();
</script>
